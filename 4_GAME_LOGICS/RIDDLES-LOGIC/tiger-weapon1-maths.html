<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mathematics Weapon | Tiger vs Kabir 3D</title>
<style>
:root{--g:#00ff41;--gd:#00a82a;--r:#ff3b3b;--c:#3df2ff;--bg:#020702}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:"Courier New",Courier,monospace;background:var(--bg);color:var(--g);min-height:100vh;display:flex;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));text-shadow:0 0 6px rgba(0,255,65,.55)}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.35}
body::after{content:"";position:fixed;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0,rgba(0,0,0,.28) 1px,transparent 1px,transparent 3px)}
main{position:relative;z-index:1;width:100%;max-width:640px}
.back{display:inline-block;margin-bottom:10px;color:var(--c);text-decoration:none;font-size:.85rem;text-shadow:0 0 6px var(--c)}
.back:hover{text-decoration:underline}
h1{font-size:1.15rem;margin:0 0 8px;color:var(--g);letter-spacing:1px;animation:glitch 4s infinite}
h1::before{content:"root@vault:~# ";color:var(--gd)}
h1::after{content:"█";margin-left:3px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes glitch{0%,92%,100%{transform:none}93%{transform:translateX(-3px);text-shadow:2px 0 var(--r),-2px 0 var(--c)}95%{transform:translateX(3px);text-shadow:-2px 0 var(--r),2px 0 var(--c)}97%{transform:none}}
.bar{display:flex;justify-content:space-between;font-size:.85rem;color:var(--gd);margin-bottom:12px;letter-spacing:1px}
.card{background:rgba(0,12,2,.85);border:1px solid var(--g);border-radius:6px;padding:18px;box-shadow:0 0 18px rgba(0,255,65,.35),inset 0 0 22px rgba(0,255,65,.08)}
#q{font-size:1.05rem;margin:0 0 14px;line-height:1.45}
#q::before{content:"> "}
.o{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid var(--gd);border-radius:3px;background:rgba(0,255,65,.05);color:var(--g);font:inherit;font-size:.95rem;text-shadow:inherit;cursor:pointer}
.o:hover:not(:disabled){background:rgba(0,255,65,.15);border-color:var(--g);box-shadow:0 0 10px rgba(0,255,65,.45)}
.o:disabled{cursor:default}
.ok{border-color:var(--g);background:rgba(0,255,65,.2);box-shadow:0 0 12px rgba(0,255,65,.6)}
.no{border-color:var(--r);color:#ff8a8a;background:rgba(255,59,59,.12);box-shadow:0 0 12px rgba(255,59,59,.5);text-shadow:0 0 5px var(--r)}
#m{min-height:1.5em;margin:12px 0;font-weight:700;letter-spacing:.5px}
#n{padding:10px 18px;border:1px solid var(--g);border-radius:2px;background:transparent;color:var(--g);font:inherit;font-weight:700;text-shadow:inherit;letter-spacing:1px;cursor:pointer}
#n:hover,#n:active{background:var(--g);color:#000;text-shadow:none}
@media (prefers-reduced-motion:reduce){#rain{display:none}h1,h1::after{animation:none}}
</style></head><body><canvas id="rain"></canvas><main>
<a href="TIGER-Intro-Chat.html" class="back">← Back to Chat</a>
<h1>Mathematics Weapon</h1>
<div class="bar"><span id="p"></span><span id="s"></span></div>
<div class="card"><p id="q"></p><div id="a"></div><div id="m"></div><button id="n" hidden>Next</button></div>
</main><script>
const PASS=1;
const Q=[["What is 28 + 34?", ["52", "62", "72", "57"], 1], ["What is 83 − 35?", ["38", "58", "48", "42"], 2], ["What is 12 × 8?", ["86", "96", "88", "108"], 1], ["What is 144 ÷ 12?", ["10", "11", "12", "14"], 2], ["What is 15% of 200?", ["20", "25", "30", "35"], 2], ["What is the square of 13?", ["156", "169", "179", "196"], 1], ["What is √225?", ["12", "13", "15", "25"], 2], ["What is 3/4 of 80?", ["40", "50", "60", "70"], 2], ["If x + 10 = 35, find x.", ["25", "35", "59", "24"], 0], ["What is 5 × 11?", ["49", "55", "43", "56"], 1], ["Find the HCF of 12 and 18.", ["2", "3", "6", "9"], 2], ["Find the LCM of 4 and 6.", ["8", "10", "12", "24"], 2], ["What is 25 ÷ 4?", ["5.25", "6.25", "6.5", "7.25"], 1], ["What is 5/8 expressed as a percentage?", ["50%", "60%", "62.5%", "75%"], 2], ["A shirt costs ₹800 after a 20% discount. What was its original price?", ["₹900", "₹960", "₹1,000", "₹1,200"], 2], ["A vehicle travels 120 km in 3 hours. What is its average speed?", ["30 km/h", "40 km/h", "50 km/h", "60 km/h"], 1], ["Find the average of 10, 20 and 30.", ["15", "20", "25", "30"], 1], ["What is the simple interest on ₹1,000 at 5% per year for 2 years?", ["₹50", "₹100", "₹150", "₹200"], 1], ["A product bought for ₹500 is sold for ₹600. What is the profit percentage?", ["10%", "15%", "20%", "25%"], 2], ["A number divided by 5 gives 9. What is the number?", ["35", "40", "45", "50"], 2], ["What is 2⁵?", ["10", "16", "25", "32"], 3], ["What is 25²?", ["525", "625", "675", "725"], 1], ["Simplify the ratio 12:18.", ["2:3", "3:2", "4:5", "6:9"], 0], ["If 5 pens cost ₹50, what do 8 pens cost at the same rate?", ["₹60", "₹70", "₹80", "₹100"], 2], ["What is 0.1 + 0.2?", ["0.03", "0.3", "3", "0.11"], 1], ["What is 1/2 + 1/3?", ["2/5", "1/5", "5/6", "3/6"], 2], ["What is the perimeter of a square with side 9 cm?", ["18 cm", "27 cm", "36 cm", "81 cm"], 2], ["What is the area of a rectangle 8 cm long and 5 cm wide?", ["13 cm²", "26 cm²", "40 cm²", "80 cm²"], 2], ["What is the area of a triangle with base 10 cm and height 6 cm?", ["60 cm²", "30 cm²", "16 cm²", "20 cm²"], 1], ["How many degrees are in a right angle?", ["45°", "90°", "180°", "360°"], 1], ["What is the next number: 2, 4, 8, 16, __?", ["20", "24", "30", "32"], 3], ["What is the next number: 5, 10, 15, 20, __?", ["22", "25", "30", "35"], 1], ["If 3x = 27, find x.", ["6", "8", "9", "12"], 2], ["If 2x + 3 = 13, find x.", ["4", "5", "6", "7"], 1], ["What is the cube of 4?", ["16", "32", "48", "64"], 3], ["What is √400?", ["10", "15", "20", "40"], 2], ["A class has 40 students; 25% are absent. How many are present?", ["10", "20", "30", "35"], 2], ["A train travels 150 km in 2.5 hours. What is its average speed?", ["50 km/h", "55 km/h", "60 km/h", "75 km/h"], 2], ["Convert 2.5 hours to minutes.", ["120", "135", "150", "180"], 2], ["What is the sum of the first five positive integers?", ["10", "15", "20", "25"], 1], ["What is the median of 3, 7, 9, 11, 15?", ["7", "9", "10", "11"], 1], ["A bag has 3 red balls and 7 blue balls. How many balls are there?", ["4", "7", "10", "21"], 2], ["What is the probability of getting heads on a fair coin toss?", ["1/3", "1/2", "1/4", "1"], 1], ["What is 45% of 400?", ["160", "170", "180", "200"], 2], ["A number increases from 80 to 100. What is the percentage increase?", ["20%", "25%", "30%", "40%"], 1], ["If 6 workers finish a job in 10 days, how many worker-days does the job require?", ["16", "40", "60", "100"], 2], ["What is 0.4 × 10?", ["0.4", "3", "4", "40"], 2], ["What is the value of 3! (3 factorial)?", ["6", "12", "15", "60"], 0], ["A clock shows 3:00. What is the smaller angle between its hands?", ["45°", "60°", "90°", "180°"], 2], ["What is the sum of the interior angles of a triangle?", ["90°", "180°", "270°", "360°"], 1]];
const $=i=>document.getElementById(i);
let i=0,sc=0,order=Q.map((_,k)=>k).sort(()=>Math.random()-.5).slice(0,1);
function show(){
 if(i>=order.length){$("q").textContent="MISSION COMPLETE // Weapons unlocked: "+sc+" / "+order.length;$("a").innerHTML="";$("m").textContent="";$("n").textContent="Back to Chat";$("n").hidden=false;$("n").onclick=()=>location.href="TIGER-Intro-Chat.html";return}
 const [q,o,ans]=Q[order[i]];
 const opts=o.map((t,k)=>[t,k===ans]).sort(()=>Math.random()-.5);
 $("p").textContent="Question "+(i+1)+" / "+order.length;$("s").textContent="Unlocked: "+sc;
 $("q").textContent=q;$("a").innerHTML="";$("m").textContent="";$("n").hidden=true;
 opts.forEach(([t,c],k)=>{const b=document.createElement("button");b.className="o";b.textContent="ABCD"[k]+") "+t;
  b.onclick=()=>{localStorage.setItem("tiger_done_maths","1");[...$("a").children].forEach((x,j)=>{x.disabled=true;if(opts[j][1])x.classList.add("ok")});
   if(c){sc++;if(sc>=PASS)localStorage.setItem("tiger_weapon_maths","1");$("m").style.color="";$("m").textContent="[ ACCESS GRANTED ] Correct! Weapon unlocked."}else{b.classList.add("no");$("m").style.color="#ff3b3b";$("m").textContent="[ ACCESS DENIED ] Wrong. Weapon stays locked."}
   $("s").textContent="Unlocked: "+sc;$("n").textContent=i==order.length-1?"Finish":"Next";$("n").hidden=false;$("n").onclick=()=>{i++;show()}};
  $("a").appendChild(b)});
}
if(localStorage.getItem("tiger_done_maths")==="1"){$("p").textContent="";$("q").textContent="[ ALREADY ATTEMPTED ] This weapon is already decided. Return to chat.";$("n").textContent="Back to Chat";$("n").hidden=false;$("n").onclick=()=>location.href="TIGER-Intro-Chat.html"}else show();
(function(){var cv=document.getElementById("rain"),cx=cv.getContext("2d"),fs=16,cols,drops,chars="01ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿ#$%&<>/=+*";
function size(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.ceil(cv.width/fs);drops=[];for(var i=0;i<cols;i++)drops[i]=Math.random()*-50}
size();addEventListener("resize",size);
setInterval(function(){cx.fillStyle="rgba(2,7,2,.12)";cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle="#00ff41";cx.font=fs+"px monospace";
for(var i=0;i<cols;i++){cx.fillText(chars.charAt(Math.floor(Math.random()*chars.length)),i*fs,drops[i]*fs);if(drops[i]*fs>cv.height&&Math.random()>.975)drops[i]=0;drops[i]++}},60)})();
</script></body></html>
