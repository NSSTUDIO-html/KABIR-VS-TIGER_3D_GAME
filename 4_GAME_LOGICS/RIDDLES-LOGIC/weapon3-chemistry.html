<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chemistry Weapon | Kabir vs Tiger 3D</title>
<style>
:root{--g:#00ff41;--gd:#00a82a;--r:#ff3b3b;--c:#3df2ff;--bg:#020702}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:"Courier New",Courier,monospace;background:var(--bg);color:var(--g);min-height:100vh;display:flex;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));text-shadow:0 0 6px rgba(0,255,65,.55)}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.35}
body::after{content:"";position:fixed;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0,rgba(0,0,0,.28) 1px,transparent 1px,transparent 3px)}
main{position:relative;z-index:1;width:100%;max-width:640px}
.back{display:inline-block;margin-bottom:10px;color:var(--c);text-decoration:none;font-size:.85rem;text-shadow:0 0 6px var(--c)}
.back:hover{text-decoration:underline}
h1{font-size:1.15rem;margin:0 0 8px;color:var(--g);letter-spacing:1px;animation:glitch 4s infinite}
h1::before{content:"root@vault:~# ";color:var(--gd)}
h1::after{content:"█";margin-left:3px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes glitch{0%,92%,100%{transform:none}93%{transform:translateX(-3px);text-shadow:2px 0 var(--r),-2px 0 var(--c)}95%{transform:translateX(3px);text-shadow:-2px 0 var(--r),2px 0 var(--c)}97%{transform:none}}
.bar{display:flex;justify-content:space-between;font-size:.85rem;color:var(--gd);margin-bottom:12px;letter-spacing:1px}
.card{background:rgba(0,12,2,.85);border:1px solid var(--g);border-radius:6px;padding:18px;box-shadow:0 0 18px rgba(0,255,65,.35),inset 0 0 22px rgba(0,255,65,.08)}
#q{font-size:1.05rem;margin:0 0 14px;line-height:1.45}
#q::before{content:"> "}
.o{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid var(--gd);border-radius:3px;background:rgba(0,255,65,.05);color:var(--g);font:inherit;font-size:.95rem;text-shadow:inherit;cursor:pointer}
.o:hover:not(:disabled){background:rgba(0,255,65,.15);border-color:var(--g);box-shadow:0 0 10px rgba(0,255,65,.45)}
.o:disabled{cursor:default}
.ok{border-color:var(--g);background:rgba(0,255,65,.2);box-shadow:0 0 12px rgba(0,255,65,.6)}
.no{border-color:var(--r);color:#ff8a8a;background:rgba(255,59,59,.12);box-shadow:0 0 12px rgba(255,59,59,.5);text-shadow:0 0 5px var(--r)}
#m{min-height:1.5em;margin:12px 0;font-weight:700;letter-spacing:.5px}
#n{padding:10px 18px;border:1px solid var(--g);border-radius:2px;background:transparent;color:var(--g);font:inherit;font-weight:700;text-shadow:inherit;letter-spacing:1px;cursor:pointer}
#n:hover,#n:active{background:var(--g);color:#000;text-shadow:none}
@media (prefers-reduced-motion:reduce){#rain{display:none}h1,h1::after{animation:none}}
</style></head><body><canvas id="rain"></canvas><main>
<a href="Kabir-Intro-Chat.html" class="back">← Back to Chat</a>
<h1>Chemistry Weapon</h1>
<div class="bar"><span id="p"></span><span id="s"></span></div>
<div class="card"><p id="q"></p><div id="a"></div><div id="m"></div><button id="n" hidden>Next</button></div>
</main><script>
const PASS=1;
const Q=[["What is the chemical formula of water?", ["CO₂", "H₂O", "O₂", "NaCl"], 1], ["What is the chemical symbol for oxygen?", ["Ox", "O", "Og", "On"], 1], ["What is the chemical symbol for gold?", ["Go", "Gd", "Au", "Ag"], 2], ["What is the chemical symbol for sodium?", ["S", "So", "Na", "N"], 2], ["What is the chemical formula of common table salt?", ["HCl", "NaCl", "KOH", "CaCO₃"], 1], ["Which gas do plants absorb during photosynthesis?", ["Oxygen", "Nitrogen", "Carbon dioxide", "Hydrogen"], 2], ["Which gas is required for ordinary combustion?", ["Oxygen", "Helium", "Neon", "Argon"], 0], ["What is the pH of pure water at about 25°C?", ["1", "5", "7", "14"], 2], ["A substance with a pH below 7 is generally what?", ["Acidic", "Basic", "Neutral", "Metallic"], 0], ["A substance with a pH above 7 is generally what?", ["Acidic", "Basic", "Neutral", "Always poisonous"], 1], ["Which acid is present in lemons?", ["Sulfuric acid", "Citric acid", "Nitric acid", "Hydrochloric acid"], 1], ["Which acid is commonly present in vinegar?", ["Acetic acid", "Carbonic acid", "Sulfuric acid", "Boric acid"], 0], ["What is the chemical formula of carbon dioxide?", ["CO", "CO₂", "C₂O", "CaO"], 1], ["Which gas is commonly used to fill balloons that need to float safely?", ["Oxygen", "Chlorine", "Helium", "Carbon dioxide"], 2], ["What is the chemical symbol for iron?", ["Ir", "In", "Fe", "I"], 2], ["What is the chemical symbol for silver?", ["Si", "Ag", "Au", "Sv"], 1], ["Which particle has a negative electric charge?", ["Proton", "Neutron", "Electron", "Nucleus"], 2], ["Which particle has a positive electric charge?", ["Proton", "Neutron", "Electron", "Photon"], 0], ["Which subatomic particle has no electric charge?", ["Proton", "Neutron", "Electron", "Positron"], 1], ["What does an element's atomic number represent?", ["Number of neutrons only", "Number of protons", "Number of molecules", "Number of shells only"], 1], ["What is the smallest unit of an element that retains its chemical identity?", ["Atom", "Cell", "Tissue", "Organ"], 0], ["What is a molecule of oxygen gas made of?", ["One oxygen atom", "Two oxygen atoms", "Three oxygen atoms", "Two hydrogen atoms"], 1], ["Which of these is a noble gas?", ["Oxygen", "Nitrogen", "Neon", "Chlorine"], 2], ["Which gas makes up the largest percentage of Earth's atmosphere?", ["Oxygen", "Nitrogen", "Carbon dioxide", "Hydrogen"], 1], ["What is the approximate percentage of oxygen in dry air?", ["1%", "21%", "50%", "78%"], 1], ["What is the chemical formula of methane?", ["CH₄", "C₂H₆", "CO₂", "NH₃"], 0], ["Which gas is the main component of natural gas?", ["Methane", "Oxygen", "Chlorine", "Helium"], 0], ["What is the chemical formula of ammonia?", ["NH₃", "NO₂", "H₂O", "CH₄"], 0], ["What is the chemical formula of baking soda?", ["NaCl", "NaHCO₃", "H₂SO₄", "CaO"], 1], ["Which substance is commonly called quicklime?", ["Calcium oxide", "Sodium chloride", "Calcium carbonate", "Sodium bicarbonate"], 0], ["What is rust mainly composed of?", ["Iron oxide compounds", "Pure iron", "Sodium chloride", "Copper sulfate"], 0], ["Which metal is liquid near room temperature?", ["Iron", "Mercury", "Copper", "Aluminium"], 1], ["Which non-metal is liquid near room temperature?", ["Bromine", "Carbon", "Sulfur", "Phosphorus"], 0], ["What is the chemical formula of ozone?", ["O₂", "O₃", "CO₃", "H₂O₂"], 1], ["Which process converts a liquid into a gas from its surface?", ["Freezing", "Condensation", "Evaporation", "Deposition"], 2], ["What is the change from gas to liquid called?", ["Melting", "Condensation", "Sublimation", "Freezing"], 1], ["What is the change from solid to liquid called?", ["Melting", "Boiling", "Condensation", "Deposition"], 0], ["What is the change from liquid to solid called?", ["Evaporation", "Freezing", "Sublimation", "Melting"], 1], ["Which of these is a chemical change?", ["Cutting paper", "Melting ice", "Rusting iron", "Breaking glass"], 2], ["Which of these is a physical change?", ["Burning wood", "Rusting iron", "Cooking an egg", "Melting ice"], 3], ["What is a mixture of a metal with another element, often another metal, called?", ["Alloy", "Acid", "Base", "Isotope"], 0], ["Brass is mainly an alloy of which metals?", ["Copper and zinc", "Iron and carbon", "Copper and tin", "Aluminium and iron"], 0], ["Bronze is traditionally made mainly from which metals?", ["Copper and tin", "Iron and zinc", "Gold and silver", "Lead and mercury"], 0], ["What is the chemical formula of calcium carbonate?", ["CaCl₂", "CaCO₃", "CaO", "K₂CO₃"], 1], ["Which method can separate insoluble sand from water?", ["Filtration", "Freezing", "Magnetising water", "Combustion"], 0], ["Which method can recover dissolved salt from saltwater?", ["Filtration alone", "Evaporation", "Sieving", "Magnetic separation"], 1], ["What is the direct change from solid to gas called?", ["Condensation", "Sublimation", "Freezing", "Melting"], 1], ["Which type of bond involves the sharing of electron pairs?", ["Ionic", "Covalent", "Metallic only", "Gravitational"], 1], ["What is the main purpose of a catalyst?", ["To increase reaction rate without being consumed overall", "To become the only product", "To stop every reaction", "To add mass to atoms"], 0], ["Which gas is released when many acids react with active metals such as zinc?", ["Hydrogen", "Helium", "Neon", "Argon"], 0]];
const $=i=>document.getElementById(i);
let i=0,sc=0,order=Q.map((_,k)=>k).sort(()=>Math.random()-.5).slice(0,1);
function show(){
 if(i>=order.length){$("q").textContent="MISSION COMPLETE // Weapons unlocked: "+sc+" / "+order.length;$("a").innerHTML="";$("m").textContent="";$("n").textContent="Back to Chat";$("n").hidden=false;$("n").onclick=()=>location.href="Kabir-Intro-Chat.html";return}
 const [q,o,ans]=Q[order[i]];
 const opts=o.map((t,k)=>[t,k===ans]).sort(()=>Math.random()-.5);
 $("p").textContent="Question "+(i+1)+" / "+order.length;$("s").textContent="Unlocked: "+sc;
 $("q").textContent=q;$("a").innerHTML="";$("m").textContent="";$("n").hidden=true;
 opts.forEach(([t,c],k)=>{const b=document.createElement("button");b.className="o";b.textContent="ABCD"[k]+") "+t;
  b.onclick=()=>{localStorage.setItem("done_chemistry","1");[...$("a").children].forEach((x,j)=>{x.disabled=true;if(opts[j][1])x.classList.add("ok")});
   if(c){sc++;if(sc>=PASS)localStorage.setItem("weapon_chemistry","1");$("m").style.color="";$("m").textContent="[ ACCESS GRANTED ] Correct! Weapon unlocked."}else{b.classList.add("no");$("m").style.color="#ff3b3b";$("m").textContent="[ ACCESS DENIED ] Wrong. Weapon stays locked."}
   $("s").textContent="Unlocked: "+sc;$("n").textContent=i==order.length-1?"Finish":"Next";$("n").hidden=false;$("n").onclick=()=>{i++;show()}};
  $("a").appendChild(b)});
}
if(localStorage.getItem("done_chemistry")==="1"){$("p").textContent="";$("q").textContent="[ ALREADY ATTEMPTED ] This weapon is already decided. Return to chat.";$("n").textContent="Back to Chat";$("n").hidden=false;$("n").onclick=()=>location.href="Kabir-Intro-Chat.html"}else show();
(function(){var cv=document.getElementById("rain"),cx=cv.getContext("2d"),fs=16,cols,drops,chars="01ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿ#$%&<>/=+*";
function size(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.ceil(cv.width/fs);drops=[];for(var i=0;i<cols;i++)drops[i]=Math.random()*-50}
size();addEventListener("resize",size);
setInterval(function(){cx.fillStyle="rgba(2,7,2,.12)";cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle="#00ff41";cx.font=fs+"px monospace";
for(var i=0;i<cols;i++){cx.fillText(chars.charAt(Math.floor(Math.random()*chars.length)),i*fs,drops[i]*fs);if(drops[i]*fs>cv.height&&Math.random()>.975)drops[i]=0;drops[i]++}},60)})();
</script></body></html>
