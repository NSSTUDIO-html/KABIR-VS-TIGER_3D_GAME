<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>English Grammar Weapon | Tiger vs Kabir 3D</title>
<style>
:root{--g:#00ff41;--gd:#00a82a;--r:#ff3b3b;--c:#3df2ff;--bg:#020702}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:"Courier New",Courier,monospace;background:var(--bg);color:var(--g);min-height:100vh;display:flex;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));text-shadow:0 0 6px rgba(0,255,65,.55)}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.35}
body::after{content:"";position:fixed;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0,rgba(0,0,0,.28) 1px,transparent 1px,transparent 3px)}
main{position:relative;z-index:1;width:100%;max-width:640px}
.back{display:inline-block;margin-bottom:10px;color:var(--c);text-decoration:none;font-size:.85rem;text-shadow:0 0 6px var(--c)}
.back:hover{text-decoration:underline}
h1{font-size:1.15rem;margin:0 0 8px;color:var(--g);letter-spacing:1px;animation:glitch 4s infinite}
h1::before{content:"root@vault:~# ";color:var(--gd)}
h1::after{content:"█";margin-left:3px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes glitch{0%,92%,100%{transform:none}93%{transform:translateX(-3px);text-shadow:2px 0 var(--r),-2px 0 var(--c)}95%{transform:translateX(3px);text-shadow:-2px 0 var(--r),2px 0 var(--c)}97%{transform:none}}
.bar{display:flex;justify-content:space-between;font-size:.85rem;color:var(--gd);margin-bottom:12px;letter-spacing:1px}
.card{background:rgba(0,12,2,.85);border:1px solid var(--g);border-radius:6px;padding:18px;box-shadow:0 0 18px rgba(0,255,65,.35),inset 0 0 22px rgba(0,255,65,.08)}
#q{font-size:1.05rem;margin:0 0 14px;line-height:1.45}
#q::before{content:"> "}
.o{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid var(--gd);border-radius:3px;background:rgba(0,255,65,.05);color:var(--g);font:inherit;font-size:.95rem;text-shadow:inherit;cursor:pointer}
.o:hover:not(:disabled){background:rgba(0,255,65,.15);border-color:var(--g);box-shadow:0 0 10px rgba(0,255,65,.45)}
.o:disabled{cursor:default}
.ok{border-color:var(--g);background:rgba(0,255,65,.2);box-shadow:0 0 12px rgba(0,255,65,.6)}
.no{border-color:var(--r);color:#ff8a8a;background:rgba(255,59,59,.12);box-shadow:0 0 12px rgba(255,59,59,.5);text-shadow:0 0 5px var(--r)}
#m{min-height:1.5em;margin:12px 0;font-weight:700;letter-spacing:.5px}
#n{padding:10px 18px;border:1px solid var(--g);border-radius:2px;background:transparent;color:var(--g);font:inherit;font-weight:700;text-shadow:inherit;letter-spacing:1px;cursor:pointer}
#n:hover,#n:active{background:var(--g);color:#000;text-shadow:none}
@media (prefers-reduced-motion:reduce){#rain{display:none}h1,h1::after{animation:none}}
</style></head><body><canvas id="rain"></canvas><main>
<a href="TIGER-Intro-Chat.html" class="back">← Back to Chat</a>
<h1>English Grammar Weapon</h1>
<div class="bar"><span id="p"></span><span id="s"></span></div>
<div class="card"><p id="q"></p><div id="a"></div><div id="m"></div><button id="n" hidden>Next</button></div>
</main><script>
const PASS=1;
const Q=[["She ___ to school every day.", ["go", "goes", "going", "gone"], 1], ["They ___ playing football now.", ["is", "am", "are", "was"], 2], ["What is the plural of \"child\"?", ["childs", "childes", "children", "childrens"], 2], ["What is the past tense of \"go\"?", ["goed", "went", "gone", "going"], 1], ["What is the past participle of \"eat\"?", ["ate", "eaten", "eating", "eated"], 1], ["___ apple a day keeps the doctor away.", ["A", "An", "The", "No article"], 1], ["___ sun rises in the east.", ["A", "An", "The", "No article"], 2], ["Which word is a noun?", ["Quickly", "Happy", "Teacher", "Run"], 2], ["Which word is a verb?", ["Beautiful", "Jump", "Table", "Slowly"], 1], ["Which word is an adjective?", ["Brave", "Bravely", "Bravery", "Braves"], 0], ["Which word is an adverb?", ["Quick", "Quickly", "Quickness", "Quicker"], 1], ["Which word is a pronoun?", ["Table", "He", "Run", "Green"], 1], ["I have ___ umbrella.", ["a", "an", "the", "any"], 1], ["He is ___ than his brother.", ["tall", "taller", "tallest", "most tall"], 1], ["She is the ___ girl in the class.", ["smart", "smarter", "smartest", "more smart"], 2], ["Choose the correct sentence.", ["He don't like tea", "He doesn't like tea", "He not like tea", "He no like tea"], 1], ["Choose the correct sentence.", ["I am agree", "I agree", "I agreeing", "I agrees"], 1], ["I ___ lunch when you called.", ["eat", "was eating", "eaten", "eats"], 1], ["We ___ finished our homework.", ["has", "have", "is", "was"], 1], ["If it rains, we ___ at home.", ["stay", "stayed", "will stay", "staying"], 2], ["The book is ___ the table.", ["of", "on", "and", "but"], 1], ["Which word is a conjunction?", ["And", "Slowly", "Table", "Green"], 0], ["___ is your name?", ["Who", "What", "Where", "Which one"], 1], ["Which sentence is in the passive voice?", ["The cat chased the mouse", "The mouse was chased by the cat", "The cat is chasing the mouse", "The cat will chase the mouse"], 1], ["What is the plural of \"tooth\"?", ["tooths", "teeth", "teeths", "toothes"], 1], ["Which spelling is correct?", ["Recieve", "Receive", "Receeve", "Riceive"], 1], ["Which word is a proper noun?", ["city", "India", "river", "country"], 1], ["Neither of the boys ___ here.", ["are", "is", "were", "be"], 1], ["What is the past tense of \"buy\"?", ["buyed", "bought", "brought", "boughten"], 1], ["Which sentence is punctuated correctly?", ["What is your name.", "What is your name,", "What is your name?", "what is your name"], 2], ["Which shows possession correctly?", ["The dogs bone", "The dog's bone", "The dogs' bone's", "The dog bone's"], 1], ["He ___ a doctor.", ["are", "am", "is", "be"], 2], ["What is the antonym of \"increase\"?", ["Rise", "Decrease", "Grow", "Add"], 1], ["What is a synonym of \"big\"?", ["Small", "Tiny", "Large", "Short"], 2], ["What is the comparative form of \"good\"?", ["gooder", "better", "best", "well"], 1], ["What is the superlative form of \"bad\"?", ["worse", "baddest", "worst", "badder"], 2], ["I look forward to ___ you.", ["see", "seeing", "saw", "seen"], 1], ["Which is a complete sentence?", ["Running fast", "She runs fast.", "Because he ran", "In the park"], 1], ["There ___ many books on the shelf.", ["is", "are", "am", "be"], 1], ["You are coming, ___?", ["isn't you", "aren't you", "don't you", "won't you"], 1], ["She has been working ___ morning.", ["for", "since", "from", "at"], 1], ["I have lived here ___ five years.", ["since", "for", "from", "at"], 1], ["What is the plural of \"mouse\" (the animal)?", ["mouses", "mice", "mices", "mouse's"], 1], ["He apologised ___ being late.", ["for", "to", "at", "with"], 0], ["Which word is an article?", ["The", "Run", "Quick", "Under"], 0], ["Each of the students ___ a book.", ["have", "has", "are", "were"], 1], ["He said, \"I am happy.\" → He said that he ___ happy.", ["is", "was", "were", "be"], 1], ["Choose the correct sentence.", ["She can sings.", "She can sing.", "She can sang.", "She cans sing."], 1], ["He speaks English ___.", ["fluent", "fluently", "fluency", "fluenter"], 1], ["Choose the correct sentence.", ["Their going to school", "They're going to school", "There going to school", "Thier going to school"], 1]];
const $=i=>document.getElementById(i);
let i=0,sc=0,order=Q.map((_,k)=>k).sort(()=>Math.random()-.5).slice(0,1);
function show(){
 if(i>=order.length){$("q").textContent="MISSION COMPLETE // Weapons unlocked: "+sc+" / "+order.length;$("a").innerHTML="";$("m").textContent="";$("n").textContent="Back to Chat";$("n").hidden=false;$("n").onclick=()=>location.href="TIGER-Intro-Chat.html";return}
 const [q,o,ans]=Q[order[i]];
 const opts=o.map((t,k)=>[t,k===ans]).sort(()=>Math.random()-.5);
 $("p").textContent="Question "+(i+1)+" / "+order.length;$("s").textContent="Unlocked: "+sc;
 $("q").textContent=q;$("a").innerHTML="";$("m").textContent="";$("n").hidden=true;
 opts.forEach(([t,c],k)=>{const b=document.createElement("button");b.className="o";b.textContent="ABCD"[k]+") "+t;
  b.onclick=()=>{localStorage.setItem("tiger_done_english","1");[...$("a").children].forEach((x,j)=>{x.disabled=true;if(opts[j][1])x.classList.add("ok")});
   if(c){sc++;if(sc>=PASS)localStorage.setItem("tiger_weapon_english","1");$("m").style.color="";$("m").textContent="[ ACCESS GRANTED ] Correct! Weapon unlocked."}else{b.classList.add("no");$("m").style.color="#ff3b3b";$("m").textContent="[ ACCESS DENIED ] Wrong. Weapon stays locked."}
   $("s").textContent="Unlocked: "+sc;$("n").textContent=i==order.length-1?"Finish":"Next";$("n").hidden=false;$("n").onclick=()=>{i++;show()}};
  $("a").appendChild(b)});
}
if(localStorage.getItem("tiger_done_english")==="1"){$("p").textContent="";$("q").textContent="[ ALREADY ATTEMPTED ] This weapon is already decided. Return to chat.";$("n").textContent="Back to Chat";$("n").hidden=false;$("n").onclick=()=>location.href="TIGER-Intro-Chat.html"}else show();
(function(){var cv=document.getElementById("rain"),cx=cv.getContext("2d"),fs=16,cols,drops,chars="01ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿ#$%&<>/=+*";
function size(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.ceil(cv.width/fs);drops=[];for(var i=0;i<cols;i++)drops[i]=Math.random()*-50}
size();addEventListener("resize",size);
setInterval(function(){cx.fillStyle="rgba(2,7,2,.12)";cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle="#00ff41";cx.font=fs+"px monospace";
for(var i=0;i<cols;i++){cx.fillText(chars.charAt(Math.floor(Math.random()*chars.length)),i*fs,drops[i]*fs);if(drops[i]*fs>cv.height&&Math.random()>.975)drops[i]=0;drops[i]++}},60)})();
</script></body></html>
