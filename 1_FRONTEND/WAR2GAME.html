<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabir vs Tiger 3D</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    background:
      radial-gradient(ellipse at top left, rgba(0, 255, 85, 0.09), transparent 45%),
      radial-gradient(ellipse at bottom right, rgba(255, 0, 35, 0.12), transparent 45%),
      linear-gradient(135deg, #030604, #080b09 55%, #100404);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .game-container {
    text-align: center;
    width: 90%;
    max-width: 600px;
    background: linear-gradient(145deg, rgba(13, 22, 16, 0.97), rgba(15, 5, 7, 0.97));
    border: 1px solid rgba(0, 255, 85, 0.35);
    border-radius: 20px;
    padding: 25px;
    box-shadow:
      0 0 20px rgba(0, 255, 85, 0.08),
      0 0 35px rgba(255, 0, 35, 0.08),
      inset 0 0 25px rgba(0, 255, 85, 0.025);
    transition: 0.3s;
  }

  .title {
    font-size: 2rem;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #00ff55;
    text-shadow: 0 0 8px rgba(0, 255, 85, 0.65),
                 0 0 22px rgba(0, 255, 85, 0.2);
  }

  .mode-tabs {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 25px;
  }

  .tab-button {
    flex: 1 1 45%;
    padding: 12px 10px;
    border: 1px solid #285e3b;
    border-radius: 10px;
    background: linear-gradient(145deg, #111a14, #100b0c);
    color: #d8e8dc;
    cursor: pointer;
    transition: 0.3s;
    font-weight: bold;
    text-shadow: 0 0 5px rgba(0, 255, 85, 0.15);
  }

  .tab-button.active,
  .tab-button:hover {
    background: linear-gradient(100deg, #00ff55, #baffcb);
    border-color: #00ff55;
    color: #031007;
    text-shadow: none;
    box-shadow: 0 0 12px rgba(0, 255, 85, 0.35);
  }

  .tab-button:nth-child(2) {
    border-color: #70232c;
  }

  .tab-button:nth-child(2).active,
  .tab-button:nth-child(2):hover {
    background: linear-gradient(100deg, #ff163d, #ff8a9c);
    border-color: #ff163d;
    color: #160306;
    box-shadow: 0 0 12px rgba(255, 22, 61, 0.35);
  }

  .tab-content {
    display: none;
    animation: fade 0.4s ease-in-out;
  }

  .tab-content.active {
    display: block;
  }

  @keyframes fade {
    from {
      opacity: 0;
      transform: translateY(5px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .image-container {
    width: 100%;
    height: auto;
    border-radius: 15px;
    overflow: hidden;
    margin-bottom: 15px;
    border: 1px solid rgba(0, 255, 85, 0.65);
    background: #080b09;
    box-shadow: 0 0 16px rgba(0, 255, 85, 0.1),
                0 0 25px rgba(255, 0, 35, 0.08);
  }

  .image-container img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: cover;
  }

  p {
    font-size: 1rem;
    margin: 10px 0 20px;
    line-height: 1.6;
    color: #c6d0c9;
  }

  .play-btn {
    padding: 12px 30px;
    border: 1px solid #00ff55;
    background: linear-gradient(100deg, #00ff55, #a4ffbb);
    color: #041008;
    font-weight: 800;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    box-shadow: 0 0 12px rgba(0, 255, 85, 0.2);
  }

  .play-btn:hover {
    transform: translateY(-2px);
    background: linear-gradient(100deg, #ff163d, #ff8a9c);
    border-color: #ff163d;
    color: #180306;
    box-shadow: 0 0 18px rgba(255, 22, 61, 0.4);
  }

  /* RESPONSIVE DESIGN */
  @media (max-width: 768px) {
    .title {
      font-size: 1.6rem;
    }

    .tab-button {
      flex: 1 1 100%;
      font-size: 0.95rem;
    }

    p {
      font-size: 0.9rem;
    }

    .play-btn {
      padding: 10px 20px;
      font-size: 0.9rem;
    }
  }

  @media (max-width: 480px) {
    .game-container {
      padding: 15px;
    }

    .title {
      font-size: 1.4rem;
      letter-spacing: 1px;
    }

    p {
      font-size: 0.85rem;
    }

    .play-btn {
      padding: 8px 18px;
      font-size: 0.85rem;
    }
  }
</style>
</head>
<body>

  <div class="game-container">
    <h1 class="title">Kabir vs Tiger 3D</h1>

    <div class="mode-tabs">
      <button class="tab-button active" onclick="openTab(event, 'aiMode')">🤖 AI Mode</button>
      <button class="tab-button" onclick="openTab(event, 'multiplayer')">🌐 Multiplayer</button>
    </div>

    <!-- AI Mode -->
    <div id="aiMode" class="tab-content active">
      <h2 style="color:#00ff55;">AI Mode</h2>
      <div class="image-container">
        <img src="../8_MEDIA-DESIGNS/ai.jpg" alt="AI Mode Preview">
      </div>
      <p>Fight against intelligent AI enemies who learn your moves!</p>
      <button class="play-btn" onclick="location.href='AI_MODE.html'">Play AI Battle</button>
   
    </div>

    <!-- Multiplayer Mode -->
    <div id="multiplayer" class="tab-content">
      <h2 style="color:#ff163d;">Multiplayer Mode</h2>
      <div class="image-container">
        <img src="../8_MEDIA-DESIGNS/m.jpg" alt="Multiplayer Mode Preview">
      </div>
      <p>Connect online and challenge real players across the world!</p>
      <button class="play-btn" onclick="location.href='M.MODE.html'">Join Multiplayer Lobby</button>
    </div>
  </div>

<script>
function openTab(event, tabName) {
  const allTabs = document.querySelectorAll('.tab-content');
  const allButtons = document.querySelectorAll('.tab-button');

  allTabs.forEach(tab => tab.classList.remove('active'));
  allButtons.forEach(btn => btn.classList.remove('active'));

  allTabs.forEach(tab => tab.classList.remove('active'));
  document.getElementById(tabName).classList.add('active');
  event.currentTarget.classList.add('active');
}
</script>

</body>
</html>
