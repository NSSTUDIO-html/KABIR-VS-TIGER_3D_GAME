<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Multiplayer – Co-op Operation</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center px-4">

  <!-- Header -->
  <div class="text-center mb-10">
    <h1 class="text-4xl font-extrabold text-red-400 drop-shadow-lg">
      MULTIPLAYER MODE
    </h1>

    <p class="text-gray-300 mt-2">
      Team up with Kabir and Tiger
    </p>

    <p class="text-gray-500 text-sm mt-2">
      CO-OP OPERATION • TWO HEROES • ONE MISSION
    </p>
  </div>

  <!-- Co-op Operation Button -->
  <div class="w-full max-w-md">

    <button
      onclick="location.href='multi_operation.html'"
      class="w-full p-8 rounded-2xl bg-black border border-purple-500
             shadow-[0_0_20px_rgba(168,85,247,0.3)]
             hover:shadow-[0_0_35px_rgba(168,85,247,0.7)]
             hover:border-purple-400 transition duration-300">

      <p class="text-3xl font-extrabold text-purple-400">
        CO-OP OPERATION
      </p>

      <p class="text-gray-300 text-sm mt-3">
        Play together as Kabir and Tiger
      </p>

      <p class="text-gray-400 text-sm mt-2">
        Drive vehicles, control armed weapons,
        and complete missions together.
      </p>

      <span class="inline-block mt-5 px-6 py-2 rounded-full
                   bg-purple-600 text-white font-bold
                   hover:bg-purple-500 transition">
        START MISSION →
      </span>

    </button>

  </div>

</body>
</html>
