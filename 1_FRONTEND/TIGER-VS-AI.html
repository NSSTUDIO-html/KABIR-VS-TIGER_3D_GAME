<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#08111e">
  <title>Tiger vs Kabir 3D | AI Mode</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080b10;
      color: white;
      font-family: Arial, sans-serif;
      touch-action: none;
      user-select: none;
    }

    
    
    .weapon-panel {
      position: absolute;
      top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      width: min(45vw, 340px);
      border-radius: 14px;
      background: #10151ddd;
      backdrop-filter: blur(8px);
      z-index: 5;
    }

    #t-weapons {
      left: 12px;
      border: 2px solid #18d66b;
      box-shadow: 0 0 15px #18d66b30;
    }

    #k-weapons {
      right: 12px;
      border: 2px solid #ff3434;
      box-shadow: 0 0 15px #ff343430;
    }

    .hero-name {
      margin: 0;
      font-size: clamp(12px, 2vw, 17px);
      font-weight: 900;
      letter-spacing: 2px;
    }

    #t-weapons .hero-name {
      color: #18e879;
    }

    #k-weapons .hero-name {
      color: #ff4141;
      text-align: right;
    }

    .weapon-list {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
    }

    .weapon {
      min-width: 0;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ffffff30;
      border-radius: 8px;
      background: #ffffff08;
      padding: 4px;
      cursor: pointer;
    }

    #t-weapons .weapon.selected {
      border: 2px solid #18e879;
      background: #18e87925;
    }

    #k-weapons .weapon.selected {
      border: 2px solid #ff4141;
      background: #ff414125;
    }

    .weapon img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .weapon-label {
      font-size: 9px;
      line-height: 1.2;
      text-align: center;
      margin-top: 3px;
      color: #ffffffc0;
      overflow-wrap: anywhere;
    }

    .controls {
      position: absolute;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 6;
      display: grid;
      grid-template-columns: repeat(3, clamp(43px, 11vw, 66px));
      grid-template-rows: repeat(3, clamp(43px, 11vw, 66px));
      gap: 5px;
    }

    #t-controls {
      left: max(14px, env(safe-area-inset-left));
    }

    #k-controls {
      right: max(14px, env(safe-area-inset-right));
    }

    .control {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #ffffff45;
      border-radius: 13px;
      color: white;
      font-size: clamp(16px, 4vw, 25px);
      font-weight: 900;
      background: #171d27d9;
      box-shadow: 0 4px 10px #0008;
      cursor: pointer;
      touch-action: none;
    }

    #t-controls .control {
      border-color: #18d66b99;
    }

    #k-controls .control {
      border-color: #ff343499;
    }

    #t-controls .control.active {
      background: #087a3b;
      border-color: #42ff91;
      transform: scale(.95);
    }

    #k-controls .control.active {
      background: #a41515;
      border-color: #ff7777;
      transform: scale(.95);
    }

    .up {
      grid-column: 2;
      grid-row: 1;
    }

    .left {
      grid-column: 1;
      grid-row: 2;
    }

    .shoot {
      grid-column: 2;
      grid-row: 2;
      font-size: clamp(10px, 2.5vw, 15px);
      border-radius: 50%;
    }

    .right {
      grid-column: 3;
      grid-row: 2;
    }

    .down {
      grid-column: 2;
      grid-row: 3;
    }

    
    @media (orientation: landscape) {
      .weapon-panel {
        top: 10px;
        width: min(37vw, 340px);
      }

      .controls {
        grid-template-columns: repeat(3, clamp(40px, 8vh, 58px));
        grid-template-rows: repeat(3, clamp(40px, 8vh, 58px));
        gap: 4px;
        bottom: 12px;
      }

      .weapon {
        padding: 3px;
      }

      .weapon-panel {
        padding: 7px;
        gap: 5px;
      }
    }

    @media (max-width: 380px) {
      .weapon-panel {
        width: 47vw;
        padding: 6px;
      }

      .weapon-list {
        gap: 3px;
      }

      .weapon-label {
        font-size: 7px;
      }

      .controls {
        grid-template-columns: repeat(3, 39px);
        grid-template-rows: repeat(3, 39px);
        gap: 4px;
      }
    }
      .extra-control {
  position: absolute;
  width: clamp(48px, 12vw, 68px);
  height: clamp(42px, 10vw, 56px);
  font-size: 11px;
  border-radius: 10px;
}

#t-controls .extra-control[data-action="jump"],
#k-controls .extra-control[data-action="jump"] {
  top: 0;
}

#t-controls .extra-control[data-action="crouch"],
#k-controls .extra-control[data-action="crouch"] {
  top: 80px;
}

#t-controls .extra-control {
  left: 100px;
}

#k-controls .extra-control {
  right: 100px;
}

#t-controls .extra-control {
  color: #18e879;
}

#k-controls .extra-control {
  color: #ff4141;
}

@media (max-width: 380px) {
  #t-controls .extra-control {
    left: 100px;
  }

  #k-controls .extra-control {
    right: 100px;
  }
}
      
      #pause-btn {
  position: absolute;
  top: 108px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  padding: 10px 18px;
  border: 2px solid #ffffff70;
  border-radius: 10px;
  background: #171d27ee;
  color: white;
  font-size: 12px;
  font-weight: 900;
  cursor: pointer;
  touch-action: manipulation;
}

#pause-btn.paused {
  background: #e6a817;
  color: #111;
  border-color: #ffda70;
}

@media (orientation: landscape) {
  #pause-btn {
    top: 50px;
  }
}
      .health-panel {
  position: absolute;
  top: 105px;
  width: min(35vw, 280px);
  padding: 8px 10px;
  background: #10151ddd;
  border-radius: 10px;
  z-index: 8;
}

#t-health {
  left: 12px;
}

#k-health {
  right: 12px;
}

.health-info {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
  color: white;
  font-size: clamp(9px, 2vw, 13px);
  font-weight: 900;
}

.health-track {
  height: 12px;
  width: 100%;
  background: #333944;
  border-radius: 20px;
  overflow: hidden;
}

.health-fill {
  height: 100%;
  width: 100%;
  border-radius: 20px;
  transition: width 0.2s ease;
}

.tiger-track {
  border: 1px solid #18e879;
}

.tiger-health {
  background: linear-gradient(90deg, #078b40, #35ff88);
}

.kabir-track {
  border: 1px solid #ff4141;
}

.kabir-health {
  background: linear-gradient(90deg, #a50000, #ff4545);
}

@media (orientation: landscape) {
  .health-panel {
    top: 90px;
    width: min(30vw, 260px);
  }
}
    /* ---- Scene canvas (background layer) ---- */
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; touch-action: none; outline: none; }
    /* ---- HUD layer on top: lets camera drags pass through, UI stays tappable ---- */
    #game { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: none; }
    #game .weapon-panel, #game .controls, #game .health-panel, #game #pause-btn { pointer-events: auto; }
  </style>

  <!-- SCENE + TREES -->
  <script>
  (function () {
    'use strict';

    const canvas = document.getElementById('scene');

    // Initialize Babylon Engine
    let engine;
    try {
      engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: false, stencil: true, powerPreference: 'high-performance' });
    } catch (err) {
      console.error(err);
      alert('WebGL not available on your device.');
      return;
    }
    engine.setHardwareScalingLevel(1 / Math.min(window.devicePixelRatio || 1, 2));

    // Create Scene
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.52, 0.65, 0.78, 1); // Ice blue atmosphere
    scene.fogMode = BABYLON.Scene.FOGMODE_LINEAR;
    scene.fogColor = new BABYLON.Color3(0.52, 0.65, 0.78);
    scene.fogStart = 60;
    scene.fogEnd = 250;

    // ACES Tone Mapping for cinematic look
    const ipc = scene.imageProcessingConfiguration;
    ipc.toneMappingEnabled = true;
    ipc.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
    ipc.exposure = 1.1;

    // Camera
    const camera = new BABYLON.ArcRotateCamera('orbit', Math.PI / 4, Math.PI / 3.2, 90, new BABYLON.Vector3(0, 0, 0), scene);
    camera.attachControl(canvas, true);
    camera.inertia = 0.9;
    camera.panningInertia = 0.9;
    camera.angularSensibilityX = 450;
    camera.angularSensibilityY = 450;
    camera.wheelDeltaPercentage = 0.015;
    camera.pinchDeltaPercentage = 0.015;
    camera.useNaturalPinchZoom = true;
    camera.lowerBetaLimit = 0.02;
    camera.upperBetaLimit = Math.PI / 2 - 0.01;
    camera.lowerRadiusLimit = 15;
    camera.upperRadiusLimit = 200;
    camera.fov = 0.95;

    // Lighting
    const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
    hemi.diffuse = new BABYLON.Color3(0.9, 0.95, 1.0);
    hemi.groundColor = new BABYLON.Color3(0.2, 0.3, 0.4);
    hemi.intensity = 0.8;

    const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.6, -1, -0.4), scene);
    sun.diffuse = new BABYLON.Color3(1.0, 0.96, 0.88);
    sun.intensity = 1.5;

    const fill = new BABYLON.DirectionalLight('fill', new BABYLON.Vector3(0.5, -0.3, 0.5), scene);
    fill.diffuse = new BABYLON.Color3(0.5, 0.75, 1.0);
    fill.intensity = 0.5;

    // ==========================================
    // PROCEDURAL ICE ISLAND GENERATION
    // ==========================================
    const terrainSize = 250;
    const subdivisions = 60;
    const ground = BABYLON.MeshBuilder.CreateGround("iceIsland", { width: terrainSize, height: terrainSize, subdivisions: subdivisions }, scene);
    
    const positions = ground.getVerticesData(BABYLON.VertexBuffer.PositionKind);
    for (let i = 0; i < positions.length; i += 3) {
      let x = positions[i];
      let z = positions[i + 2];
      let distFromCenter = Math.sqrt(x * x + z * z);
      
      if (distFromCenter < 52) {
        // Multi-frequency procedural noise simulation for jagged mountain peaks and ridges
        let h = Math.sin(x * 0.08) * Math.cos(z * 0.08) * 6 +
                Math.sin(x * 0.2) * Math.cos(z * 0.2) * 2.5 +
                Math.cos(x * 0.03 + z * 0.03) * 8;
        
        // Island falloff shape (higher in center, dropping off smoothly near shores)
        let falloff = Math.max(0, 1 - (distFromCenter / 50));
        falloff = falloff * falloff * (3 - 2 * falloff); // Smoothstep
        
        positions[i + 1] = (h * falloff * 1.4) + (falloff * 22);
      } else {
        // Underwater shelves / beach edge
        positions[i + 1] = -1.5;
      }
    }
    ground.updateVerticesData(BABYLON.VertexBuffer.PositionKind, positions);
    ground.createNormals();

    // Ice Material
    const iceMat = new BABYLON.StandardMaterial("iceMat", scene);
    iceMat.diffuseColor = new BABYLON.Color3(0.82, 0.92, 0.98);
    iceMat.specularColor = new BABYLON.Color3(0.95, 0.98, 1.0);
    iceMat.specularPower = 96;
    ground.material = iceMat;

    // ==========================================
    // PROCEDURAL OCEAN / WATER PLANE
    // ==========================================
    const water = BABYLON.MeshBuilder.CreateGround("water", { width: 500, height: 500 }, scene);
    water.position.y = -1.0;
    const waterMat = new BABYLON.StandardMaterial("waterMat", scene);
    waterMat.diffuseColor = new BABYLON.Color3(0.04, 0.24, 0.42);
    waterMat.specularColor = new BABYLON.Color3(0.7, 0.85, 1.0);
    waterMat.alpha = 0.88;
    water.material = waterMat;

    // ==========================================
    // PROCEDURAL GLACIAL CRYSTALS & ICEBERGS
    // ==========================================
    const crystalMat = new BABYLON.StandardMaterial("crystalMat", scene);
    crystalMat.diffuseColor = new BABYLON.Color3(0.65, 0.88, 0.98);
    crystalMat.specularColor = new BABYLON.Color3(1, 1, 1);
    crystalMat.specularPower = 128;
    crystalMat.alpha = 0.92;

    for (let i = 0; i < 18; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 15 + Math.random() * 32;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;

      // Stylized low-poly crystal monoliths
      const crystal = BABYLON.MeshBuilder.CreateCylinder(`crystal_${i}`, {
        diameterTop: 0.2 + Math.random() * 0.8,
        diameterBottom: 1.5 + Math.random() * 2.5,
        height: 6 + Math.random() * 12,
        tessellation: 5
      }, scene);

      crystal.position.set(x, 4 + Math.random() * 3, z);
      crystal.rotation.x = (Math.random() - 0.5) * 0.3;
      crystal.rotation.z = (Math.random() - 0.5) * 0.3;
      crystal.rotation.y = Math.random() * Math.PI;
      crystal.material = crystalMat;
    }

    // ==========================================
    // VOLUMETRIC FALLING SNOW PARTICLES
    // ==========================================
    const snowSystem = new BABYLON.ParticleSystem("snow", 2500, scene);
    snowSystem.particleTexture = new BABYLON.Texture("https://playground.babylonjs.com/textures/flare.png", scene);
    snowSystem.emitter = new BABYLON.Vector3(0, 60, 0);
    snowSystem.minEmitBox = new BABYLON.Vector3(-120, 0, -120);
    snowSystem.maxEmitBox = new BABYLON.Vector3(120, 0, 120);
    snowSystem.color1 = new BABYLON.Color4(1, 1, 1, 1);
    snowSystem.color2 = new BABYLON.Color4(0.85, 0.92, 1, 1);
    snowSystem.colorDead = new BABYLON.Color4(0.6, 0.7, 0.8, 0);
    snowSystem.minSize = 0.3;
    snowSystem.maxSize = 0.9;
    snowSystem.minLifeTime = 6;
    snowSystem.maxLifeTime = 12;
    snowSystem.emitRate = 400;
    snowSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;

    scene,
    function (meshes, particleSystems, skeletons, animationGroups) {

      });

      root.position.set(x, y, z);
      root.rotation.y = faceY;

      animationGroups.forEach(group => group.stop());

      heroes[name] = { root, meshes, animationGroups };
      console.log(name + " loaded:", meshes.length, "meshes");
    },
    null,
    function (scene, message, exception) {
      console.error(name + " loading failed:", message, exception);

}

  <!-- HUD LOGIC -->
  <script>
    // Selected weapon for each hero
    const selectedWeapons = {
      tiger: "hand-grips",
      kabir: "katana"
    };

    // Track currently held controls
    const activeControls = new Set();

    // Weapon selection
    document.querySelectorAll(".weapon[data-weapon]").forEach(button => {
      button.addEventListener("click", () => {
        const hero = button.dataset.hero;
        const weapon = button.dataset.weapon;

        document.querySelectorAll(
          `.weapon[data-hero="${hero}"][data-weapon]`
        ).forEach(item => item.classList.remove("selected"));

        button.classList.add("selected");
        selectedWeapons[hero] = weapon;

        // Listen for this event from your game code
        window.dispatchEvent(new CustomEvent("weaponselect", {
          detail: { hero, weapon }
        }));

        console.log(`${hero} selected ${weapon}`);
      });
    });

    // Hold-to-move and shoot controls
    document.querySelectorAll(".control[data-action]").forEach(button => {
      const hero = button.dataset.hero;
      const action = button.dataset.action;
      const controlId = `${hero}:${action}`;

      function press(event) {
        event.preventDefault();

        if (activeControls.has(controlId)) return;

        activeControls.add(controlId);
        button.classList.add("active");

        window.dispatchEvent(new CustomEvent("hudcontrol", {
          detail: {
            hero,
            action,
            pressed: true,
            weapon: selectedWeapons[hero]
          }
        }));
      }

      function release(event) {
        if (event) event.preventDefault();

        activeControls.delete(controlId);
        button.classList.remove("active");

        window.dispatchEvent(new CustomEvent("hudcontrol", {
          detail: {
            hero,
            action,
            pressed: false,
            weapon: selectedWeapons[hero]
          }
        }));
      }

      button.addEventListener("pointerdown", press);
      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", release);

      button.addEventListener("contextmenu", event => {
        event.preventDefault();
      });
    });

    // Release held controls if the page loses focus
    window.addEventListener("blur", () => {
      document.querySelectorAll(".control.active").forEach(button => {
        const hero = button.dataset.hero;
        const action = button.dataset.action;
        const controlId = `${hero}:${action}`;

        activeControls.delete(controlId);
        button.classList.remove("active");

        window.dispatchEvent(new CustomEvent("hudcontrol", {
          detail: {
            hero,
            action,
            pressed: false,
            weapon: selectedWeapons[hero]
          }
        }));
      });
    });

      const heroHealth = {
  tiger: 100,
  kabir: 100
};

function updateHealth(hero, health) {
  if (!(hero in heroHealth)) return;

  health = Math.max(0, Math.min(100, Number(health)));
  if (!Number.isFinite(health)) return;

  heroHealth[hero] = health;

  const prefix = hero === "tiger" ? "t" : "k";

  document.getElementById(`${prefix}-health-fill`)
    .style.width = `${health}%`;

  document.getElementById(`${prefix}-health-text`)
    .textContent = `${health} / 100`;
}

// Example: Kabir takes 25 damage

// Example: Tiger takes 10 damage
// updateHealth("tiger", heroHealth.tiger - 10);

// Connect to your combat system:
window.addEventListener("healthchange", event => {
  const { hero, health } = event.detail;
  updateHealth(hero, health);
});

  });

// Play the sound for the currently selected weapon
function playWeaponShootAudio(hero) {
  const weapon = selectedWeapons[hero];
  const audio = weaponShootAudio[hero]?.[weapon];

  if (!audio) {
    console.warn("No shoot audio found:", hero, weapon);
    return;
  }

  // Restart the sound on every shot
  audio.pause();
  audio.currentTime = 0;

  audio.play().catch(error => {
    console.warn("Audio playback failed:", error);
  });
}
